name: veredins ci - server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"

jobs:
  server:
    name: build & test server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: 🧾 checkout repo
        uses: actions/checkout@v4

      - name: 🧠 setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 📦 go mod tidy
        run: go mod tidy

      - name: 🧪 go test
        run: go test ./...
      
      - name: 🏗️ go build
        run: go build ./cmd

      - name: 🐳 docker build
        run: docker build -t veredins-server .